name: My First Build vprofile
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1-5"
  
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Maven Build
        run: mvn install
      
      - name: upload build artifacts(war)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war
      
      - name: Nofify if builds failed
        if: failure()
        run: echo "🚨 Build failed checks logs"
        
  testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      
      - name: Run test on other branches
        if: github.ref != 'refs/heads/main'
        run: eacho 'Skipping tests and checkstyles'
