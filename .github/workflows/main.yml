name: My First Build vprofile
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  
  workflow_dispatch:

  #schedule:
  #  - cron: "0 2 * * 1-5"

permissions:
  contents: read

env:
  ECR_REPOSITORY: dev/vprofile-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Maven Build
        run: mvn install
      
      - name: upload build artifacts(war)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war
      
      - name: Nofify if builds failed
        if: failure()
        run: echo "🚨 Build failed checks logs"
        
  testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      
      - name: Run test on other branches
        if: github.ref != 'refs/heads/main'
        run: echo 'Skipping tests and checkstyles'

  
  security_scan:
    runs-on: ubuntu-latest
    needs: testing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: json
        exit-code: 0
        vuln-type: os,library
        output: trivy-results.json

    - name: Upload Trivy scan results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Trivy scan results
        path: trivy-results.json
  
  build_and_push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    needs: [build, testing, security_scan]
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials 🔑
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{vars.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📌 Build, tag, and push docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: | 
          docker build -f Docker-files/app/multistage/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
